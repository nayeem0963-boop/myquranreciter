<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Quran Reciter" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Listen to Quran recitations and follow along with Arabic verses and translations."
    />
    <title>My Quran Reciter</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a light flash.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("myquranreciter.reading") || "null");
          var dark = saved && typeof saved.theme === "string"
            ? saved.theme === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
